<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVLink — your EV as an AI tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --panel2: #0f141c; --line: #1f2a38;
    --text: #e8eef5; --dim: #8fa1b5; --accent: #35e08c; --accent2: #4aa3ff;
    --warn: #ffb454; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 28px 18px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  h1 { font-size: 26px; letter-spacing: -0.5px; }
  h1 .bolt { color: var(--accent); }
  .tagline { color: var(--dim); font-size: 13px; }
  .banner {
    display: none; margin: 14px 0 0; padding: 10px 14px; border-radius: 10px;
    font-size: 13px; border: 1px solid #6b5320; background: #2a2010; color: var(--warn);
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-top: 18px;
  }
  .vrow { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .vname { font-size: 18px; font-weight: 600; }
  .badge {
    font-size: 11.5px; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    border: 1px solid #1d5c3d; color: var(--accent); background: #0d2419;
  }
  .badge.static { border-color: #6b5320; color: var(--warn); background: #2a2010; }
  .vstats { display: flex; gap: 26px; margin-top: 14px; flex-wrap: wrap; }
  .stat .k { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; }
  .stat .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .socbar { height: 8px; border-radius: 6px; background: #1a2431; margin-top: 12px; overflow: hidden; }
  .socbar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0%; transition: width .6s; }
  .connect-link { font-size: 13px; color: var(--accent2); text-decoration: none; }
  .chat { display: flex; gap: 10px; margin-top: 18px; }
  .chat input {
    flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 16px; font-size: 15px; outline: none;
  }
  .chat input:focus { border-color: var(--accent2); }
  .chat button {
    background: var(--accent); color: #06130c; font-weight: 700; font-size: 15px;
    border: 0; border-radius: 12px; padding: 0 22px; cursor: pointer;
  }
  .chat button:disabled { opacity: 0.5; cursor: default; }
  .steps { display: none; }
  .step { display: flex; align-items: center; gap: 10px; padding: 7px 2px; font-size: 14px; }
  .step .ico { width: 20px; text-align: center; }
  .step.pending { color: #55677c; }
  .step.running { color: var(--text); }
  .step.done { color: var(--dim); }
  .step.error { color: var(--err); }
  .step.skipped { color: #3d4c5e; text-decoration: line-through; }
  .step .detail { color: var(--accent2); font-size: 12.5px; margin-left: auto; text-align: right; }
  .spin { display: inline-block; animation: rot 0.9s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .toolcalls { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .toolcall { font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); }
  .toolcall b { color: var(--accent2); font-weight: 600; }
  .result { display: none; }
  .gtext { font-size: 15px; white-space: pre-wrap; }
  .gtext .who { color: var(--accent2); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 6px; }
  .itin { margin-top: 6px; position: relative; padding-left: 26px; }
  .itin::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
  .leg { position: relative; padding: 10px 0; }
  .leg::before {
    content: ""; position: absolute; left: -23.5px; top: 16px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--panel); border: 2.5px solid var(--accent2);
  }
  .leg.stop::before { border-color: var(--accent); }
  .leg .t1 { font-weight: 600; }
  .leg .t2 { color: var(--dim); font-size: 13px; }
  .soc-chip { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 1px 8px; border-radius: 7px; background: #0d2419; color: var(--accent); margin-left: 6px; }
  .charge-chip { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 1px 8px; border-radius: 7px; background: #10243a; color: var(--accent2); margin-left: 6px; }
  .totals { display: flex; gap: 24px; margin: 4px 0 10px; color: var(--dim); font-size: 13.5px; }
  .totals b { color: var(--text); }
  .assumptions { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .assumptions .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .assumptions ul { margin: 6px 0 0 16px; color: #728499; font-size: 12px; }
  .infeasible { border: 1px solid #5c2626; background: #241010; color: #ffb3b3; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  .errbox { display: none; margin-top: 18px; border: 1px solid #5c2626; background: #241010; color: #ffb3b3; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; white-space: pre-wrap; }
  footer { margin-top: 26px; color: #4a5b6e; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="bolt">&#9889;</span> EVLink</h1>
    <div class="tagline">the car itself, as a tool AI can understand</div>
  </header>
  <div class="banner" id="banner"></div>

  <div class="card" id="vcard">
    <div class="vrow">
      <div class="vname" id="vname">Loading vehicle…</div>
      <span class="badge" id="vbadge" style="display:none"></span>
    </div>
    <div class="vstats">
      <div class="stat"><div class="k">Battery</div><div class="v" id="vsoc">–</div></div>
      <div class="stat"><div class="k">Est. range</div><div class="v" id="vrange">–</div></div>
      <div class="stat"><div class="k">Location</div><div class="v" id="vloc">–</div></div>
    </div>
    <div class="socbar"><div id="socfill"></div></div>
    <div style="margin-top:10px"><a class="connect-link" id="connectlink" href="/auth/login" style="display:none">Connect vehicle via Smartcar &rarr;</a></div>
  </div>

  <div class="chat">
    <input id="msg" value="Get me to Nashville. Keep me above 15% and minimize charging time." autocomplete="off">
    <button id="send">Plan</button>
  </div>

  <div class="card steps" id="steps"></div>
  <div class="errbox" id="errbox"></div>

  <div class="result" id="result">
    <div class="card gtext" id="gtext"></div>
    <div class="card" id="plancard"></div>
  </div>

  <footer>EVLink &middot; Hack RenderATL 2026 &middot; Gemini 2.5 Flash function-calling &middot; OSRM routing &middot; US DOE AFDC chargers &middot; deterministic battery math</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadVehicle() {
  try {
    const v = await (await fetch("/api/vehicle")).json();
    $("vname").textContent = `${v.year} ${v.make} ${v.model}`;
    $("vsoc").textContent = `${Math.round(v.battery_pct)}%`;
    $("vrange").textContent = v.range_mi != null ? `${Math.round(v.range_mi)} mi` : "n/a";
    $("vloc").textContent = `${v.lat.toFixed(3)}, ${v.lon.toFixed(3)}`;
    $("socfill").style.width = `${Math.max(2, Math.min(100, v.battery_pct))}%`;
    const b = $("vbadge");
    b.style.display = "inline-block";
    if (v.source === "smartcar_simulator") {
      b.textContent = "connected demo vehicle · Smartcar simulator"; b.className = "badge";
    } else {
      b.textContent = "demo vehicle profile (static)"; b.className = "badge static";
    }
  } catch (e) { $("vname").textContent = "Backend unreachable"; }
  try {
    const h = await (await fetch("/healthz")).json();
    if (!h.gemini) { const bn = $("banner"); bn.style.display = "block";
      bn.textContent = "GEMINI_API_KEY not set — running in deterministic direct mode (no LLM). Set the key and restart to enable Gemini function-calling."; }
    if (h.smartcar_configured && !h.smartcar_connected) $("connectlink").style.display = "inline";
  } catch (e) {}
}

const ICONS = { pending: "&#9675;", running: "<span class='spin'>&#9696;</span>", done: "<span style='color:var(--accent)'>&#10003;</span>", error: "<span style='color:var(--err)'>&#10007;</span>", skipped: "&#8211;" };

function renderSteps(job) {
  const box = $("steps");
  box.style.display = "block";
  let h = "";
  for (const s of job.steps) {
    h += `<div class="step ${s.state}"><span class="ico">${ICONS[s.state] || ""}</span>
          <span>${esc(s.label)}</span><span class="detail">${esc(s.detail)}</span></div>`;
  }
  if (job.tool_calls && job.tool_calls.length) {
    h += `<div class="toolcalls">` + job.tool_calls.map(t =>
      `<div class="toolcall">&#128295; Gemini &rarr; <b>${esc(t.name)}</b>(${esc(JSON.stringify(t.args))})</div>`).join("") + `</div>`;
  }
  box.innerHTML = h;
}

function renderResult(r) {
  $("result").style.display = "block";
  const who = r.mode === "gemini" ? "Gemini 2.5 Flash" : "Direct mode (no LLM)";
  $("gtext").innerHTML = `<span class="who">${who}</span>` + esc(r.text || "");
  const p = r.trip_plan, pc = $("plancard");
  if (!p) { pc.style.display = "none"; return; }
  pc.style.display = "block";
  let h = "";
  if (!p.feasible) {
    h += `<div class="infeasible"><b>Trip not feasible.</b> ${esc(p.reason || "")}</div>`;
  } else {
    h += `<div class="totals"><span><b>${p.total_mi}</b> mi</span>
          <span><b>${Math.floor(p.drive_min/60)}h ${p.drive_min%60}m</b> driving</span>
          <span><b>${p.stops.length}</b> charging stop${p.stops.length===1?"":"s"}</span>
          <span>arrive at <b>${p.arrival_soc}%</b></span></div>`;
    h += `<div class="itin">`;
    h += `<div class="leg"><div class="t1">${esc(p.origin)}</div><div class="t2">depart</div></div>`;
    for (const s of p.stops) {
      h += `<div class="leg stop"><div class="t1">${esc(s.charger.name)}
              <span class="soc-chip">${s.arrive_soc}% &rarr; ${s.depart_soc}%</span>
              <span class="charge-chip">&#9889; ${s.charge_min} min</span></div>
            <div class="t2">${esc(s.charger.network)} &middot; ${s.charger.dcfc_ports} DC fast port${s.charger.dcfc_ports===1?"":"s"}
              &middot; mile ${Math.round(s.charger.route_mi)} &middot; ${s.charger.detour_mi} mi off route
              &middot; +${s.added_kwh} kWh</div></div>`;
    }
    h += `<div class="leg"><div class="t1">${esc(p.destination)}
            <span class="soc-chip">${p.arrival_soc}%</span></div><div class="t2">arrive</div></div>`;
    h += `</div>`;
  }
  h += `<div class="assumptions"><div class="k">Assumptions</div><ul>` +
       (p.assumptions || []).map(a => `<li>${esc(a)}</li>`).join("") + `</ul></div>`;
  pc.innerHTML = h;
}

let polling = null;
async function send() {
  const msg = $("msg").value.trim();
  if (!msg) return;
  $("send").disabled = true;
  $("result").style.display = "none";
  $("errbox").style.display = "none";
  $("steps").innerHTML = ""; $("steps").style.display = "block";
  try {
    const { job_id } = await (await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: msg }) })).json();
    polling = setInterval(async () => {
      const job = await (await fetch(`/api/jobs/${job_id}`)).json();
      renderSteps(job);
      if (job.status !== "running") {
        clearInterval(polling); $("send").disabled = false;
        if (job.error) { $("errbox").style.display = "block"; $("errbox").textContent = job.error; }
        else renderResult(job.result);
      }
    }, 400);
  } catch (e) {
    $("send").disabled = false;
    $("errbox").style.display = "block";
    $("errbox").textContent = "Request failed: " + e;
  }
}
$("send").onclick = send;
$("msg").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
loadVehicle();
if (new URLSearchParams(location.search).get("connected")) history.replaceState({}, "", "/");
</script>
</body>
</html>
